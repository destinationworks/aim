[package]
name = "aim-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aim_server"
path = "src/lib.rs"

[[bin]]
name = "aim-server"
path = "src/main.rs"

[dependencies]
aim-proto = { path = "../aim-proto" }
aim-fs = { path = "../aim-fs" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
toml.workspace = true
brotli.workspace = true
clap.workspace = true
subtle.workspace = true
zeroize.workspace = true
arc-swap.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
time = "0.3"
x509-parser = "0.16"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
aim = { path = "../aim" }
tempfile = "3"
url = "2"
