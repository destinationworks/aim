[package]
name = "aim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aim"
path = "src/lib.rs"

[[bin]]
name = "aim"
path = "src/main.rs"

[dependencies]
aim-proto = { path = "../aim-proto" }
aim-fs = { path = "../aim-fs" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rand.workspace = true
toml.workspace = true
brotli.workspace = true
clap.workspace = true
zeroize.workspace = true
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
