[workspace]
resolver = "2"
members = ["crates/aim-proto", "crates/aim-fs", "crates/aim-server", "crates/aim"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/destinationworks/aim"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
toml = "0.8"
libc = "0.2"
brotli = "8"
clap = { version = "4", features = ["derive"] }
subtle = "2.6"
zeroize = { version = "1", features = ["derive"] }
arc-swap = "1"

[profile.release]
strip = true
